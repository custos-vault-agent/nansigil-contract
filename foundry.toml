[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 110
tab_width = 4

[lint]
# Same rationale as custos-contract: forge-lint targets deployed bytecode hygiene;
# tests and one-shot scripts use forge-std idioms it flags as false positives.
ignore = ["test/**/*.sol", "script/**/*.sol"]
